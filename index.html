<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HiFi Cockpit">
  <title>HiFi Cockpit</title>
  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14161b;
      --elevated: #1c1f26;
      --hover: #252932;
      --border: #262a34;
      --gold: #d4a857;
      --gold-bg: rgba(212, 168, 87, 0.12);
      --silver-bg: rgba(180, 188, 200, 0.10);
      --bronze-bg: rgba(198, 131, 86, 0.10);
      --blue: #5c9ce6;
      --blue-bg: rgba(92, 156, 230, 0.10);
      --green: #5fb384;
      --text: #eceef2;
      --muted: #949ba6;
      --dim: #646b78;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      background: rgba(20, 22, 27, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 20px;
    }

    .header-inner {
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--elevated);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
      stroke: var(--gold);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      background: var(--bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .nav-tab {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 7px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-tab:hover {
      color: var(--text);
    }

    .nav-tab.active {
      background: var(--elevated);
      color: var(--gold);
    }

    main {
      max-width: 1220px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* TAB 1: SETUP-FINDER */
    .selector-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    @media (max-width: 920px) {
      .selector-grid {
        grid-template-columns: 1fr;
      }
    }

    .selector-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .selector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .selector-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--gold);
      font-weight: 700;
    }

    .selector-hint {
      font-size: 0.72rem;
      color: var(--dim);
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      background: var(--elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: var(--hover);
    }

    .chip.active {
      background: var(--gold-bg);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
    }

    .chip-sub {
      display: block;
      font-size: 0.71rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .chip.active .chip-sub {
      color: #e2c078;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      gap: 10px;
    }

    .toolbar-status {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .toolbar-status strong {
      color: var(--text);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn.active-toggle {
      background: var(--gold-bg);
      border-color: var(--gold);
      color: var(--gold);
    }

    .results-grid,
    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    @media (max-width: 480px) {
      .results-grid,
      .profiles-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .badge-mobil {
      color: var(--blue);
      border: 1px solid rgba(92, 156, 230, 0.3);
      background: var(--blue-bg);
    }

    .badge-musikzimmer {
      color: var(--gold);
      border: 1px solid rgba(212, 168, 87, 0.3);
      background: var(--gold-bg);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
    }

    .card-ex {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .chain-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .chain-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--dim);
    }

    .chain-val {
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--mono);
      margin-top: 2px;
      color: var(--text);
    }

    .podium {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .podium-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--elevated);
      border: 1px solid var(--border);
    }

    .podium-item.r1 {
      background: var(--gold-bg);
      border-color: rgba(212, 168, 87, 0.4);
    }

    .podium-item.r2 {
      background: var(--silver-bg);
      border-color: rgba(180, 188, 200, 0.25);
    }

    .podium-item.r3 {
      background: var(--bronze-bg);
      border-color: rgba(198, 131, 86, 0.25);
    }

    .medal {
      font-size: 1.1rem;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .hp-name {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text);
    }

    .hp-role {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .card-why {
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .empty-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      grid-column: 1 / -1;
    }

    /* TAB 2: HARDWARE & PROFILE */
    .section-block {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .section-sub {
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .diagram-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .diagram-head {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .diagram-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold);
    }

    .diagram-meta {
      font-size: 0.76rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    .svg-wrap {
      width: 100%;
      overflow-x: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .svg-wrap svg {
      width: 100%;
      height: auto;
      min-width: 640px;
      display: block;
    }

    .diagram-note {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.76rem;
    }

    .spec-label {
      color: var(--dim);
      display: block;
    }

    .spec-val {
      font-weight: 600;
      font-family: var(--mono);
      color: var(--text);
    }

    .profile-body {
      font-size: 0.81rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .profile-body strong {
      color: var(--text);
    }

    /* TAB 3: MUSIK-ENTDECKER */
    .discovery-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .discovery-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 820px) {
      .discovery-form {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold);
    }

    .field-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: var(--sans);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .field-input:focus {
      border-color: var(--gold);
    }

    .form-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-primary {
      background: var(--gold);
      color: #0c0d10;
      border: 1px solid var(--gold);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .criteria-panel {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .criteria-summary {
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }

    .criteria-summary:hover {
      color: var(--gold);
    }

    .criteria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .criteria-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .criteria-item strong {
      display: block;
      color: var(--gold);
      margin-bottom: 3px;
      font-size: 0.78rem;
    }

    .ref-banner {
      background: var(--surface);
      border: 1px solid rgba(212, 168, 87, 0.45);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ref-banner-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .ref-banner-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ref-cover {
      width: 68px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--elevated);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .ref-meta-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold);
      font-weight: 700;
    }

    .ref-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
    }

    .ref-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .ref-hw-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.8rem;
    }

    @media (max-width: 680px) {
      .ref-hw-bar {
        grid-template-columns: 1fr;
      }
    }

    .albums-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .album-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.15s ease;
    }

    .album-card:hover {
      border
